# Confirm executable can be built on pushes to main branch
name: Main
run-name: build main branch
on:
  push:
    branches:
      - main
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: set directory
        run: mkdir build && cd build
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
      - name: Run executable
        run: cd build && ./LivingRooms