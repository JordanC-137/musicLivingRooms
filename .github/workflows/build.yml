# Confirm executable can be built on pushes to main branch
name: Main
run-name: build main branch
on:
  pull_request:
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: update repo
        run: sudo apt update
      - name: Download boost
        run: sudo apt install libboost-all-dev
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build
      - name: Run executable
        run: cd build && ./LivingRooms
