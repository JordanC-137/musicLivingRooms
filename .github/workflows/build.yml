# Confirm executable can be built on pushes to main branch
name: Main
run-name: build main branch
on:
  pull_request:
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: update repo
        run: sudo apt update
      - name: install curl
        run: sudo apt-get install libcurl4-openssl-dev
      - name: Configure
        run: cmake -S . -B build -DCPR_USE_SYSTEM_CURL=ON
      - name: Build
        run: cmake --build build
      - name: Run executable
        run: cd build && ./LivingRooms
